# Render Blueprint: deploys Coupon Studio as a static site (no build step needed).
services:
  - type: web
    name: coupon-studio
    runtime: static
    buildCommand: echo "Static site - nothing to build"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /lib/*
        name: Cache-Control
        value: public, max-age=604800
      # The page, its code and the service worker are always re-checked so updates show up on the next visit.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
      - path: /render.js
        name: Cache-Control
        value: no-cache
      - path: /styles.css
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json

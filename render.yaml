# Render Blueprint: deploys Coupon Studio as a static site (no build step needed).
services:
  - type: web
    name: coupon-studio
    runtime: static
    buildCommand: echo "Static site - nothing to build"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /lib/*
        name: Cache-Control
        value: public, max-age=604800
